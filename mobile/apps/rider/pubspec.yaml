name: rider
description: App do motoqueiro.
publish_to: none
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  corrida_core:
    path: ../../packages/corrida_core
  corrida_ui:
    path: ../../packages/corrida_ui
  image_picker: ^1.2.4
  geolocator: ^14.0.1
  wakelock_plus: ^1.8.2

dev_dependencies:
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  http: ^1.2.0
  stream_channel: ^2.1.0
  web_socket_channel: ^3.0.0

flutter:
  uses-material-design: true

# Ícone do app (gerado por `dart run flutter_launcher_icons`; as imagens saem de `tool/ui/gerar_icones.js`)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#14161A"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#14161A"
    theme_color: "#14161A"
