[project]
name = "app-corrida-server"
version = "0.1.0"
description = "Servidor do app de corrida de moto do Recôncavo"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "tzdata>=2024.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.0", "websockets>=12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: rodadas longas do simulador contra um servidor de verdade (pule com -m \"not slow\")"]
